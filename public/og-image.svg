<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5ede0"/>
      <stop offset="100%" stop-color="#ede0cc"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b2020" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8b2020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Warm glow -->
  <ellipse cx="600" cy="315" rx="500" ry="300" fill="url(#glow)"/>

  <!-- Decorative neuron dots + lines (top-right) -->
  <circle cx="1050" cy="80"  r="3" fill="#1a0e07" opacity="0.18"/>
  <circle cx="1090" cy="130" r="2" fill="#1a0e07" opacity="0.14"/>
  <circle cx="1130" cy="90"  r="2.5" fill="#1a0e07" opacity="0.16"/>
  <circle cx="1070" cy="170" r="2" fill="#1a0e07" opacity="0.12"/>
  <line x1="1050" y1="80" x2="1090" y2="130" stroke="#1a0e07" stroke-width="0.8" opacity="0.10"/>
  <line x1="1090" y1="130" x2="1130" y2="90" stroke="#1a0e07" stroke-width="0.8" opacity="0.10"/>
  <line x1="1090" y1="130" x2="1070" y2="170" stroke="#1a0e07" stroke-width="0.8" opacity="0.10"/>

  <!-- Decorative dots bottom-left -->
  <circle cx="80"  cy="520" r="3"   fill="#1a0e07" opacity="0.14"/>
  <circle cx="130" cy="560" r="2"   fill="#1a0e07" opacity="0.12"/>
  <circle cx="60"  cy="570" r="2.5" fill="#1a0e07" opacity="0.10"/>
  <line x1="80" y1="520" x2="130" y2="560" stroke="#1a0e07" stroke-width="0.8" opacity="0.09"/>
  <line x1="80" y1="520" x2="60"  y2="570" stroke="#1a0e07" stroke-width="0.8" opacity="0.09"/>

  <!-- Floating rings -->
  <circle cx="160" cy="140" r="42" fill="none" stroke="#1a0e07" stroke-width="1" opacity="0.07"/>
  <circle cx="1060" cy="490" r="56" fill="none" stroke="#8b2020" stroke-width="1" opacity="0.08"/>

  <!-- Logo image (club logo) -->
  <image href="/logo.png" x="480" y="80" width="240" height="240" preserveAspectRatio="xMidYMid meet"/>

  <!-- Club name -->
  <text x="600" y="380" font-family="Georgia, serif" font-size="88" font-weight="700"
        fill="#1a0e07" text-anchor="middle" letter-spacing="-2">PSYNAPSE</text>

  <!-- Decorative line -->
  <line x1="540" y1="402" x2="660" y2="402" stroke="#8b2020" stroke-width="2" opacity="0.6"/>

  <!-- Subtitle -->
  <text x="600" y="445" font-family="Georgia, serif" font-size="28" font-weight="400" font-style="italic"
        fill="#1a0e07" text-anchor="middle" opacity="0.45">Psychology Club</text>

  <!-- School name -->
  <text x="600" y="508" font-family="Courier New, monospace" font-size="16" font-weight="400"
        fill="#1a0e07" text-anchor="middle" letter-spacing="6" opacity="0.35">DPS DWARKA · NEW DELHI</text>

  <!-- Bottom tagline -->
  <text x="600" y="578" font-family="Georgia, serif" font-size="18" font-weight="300" font-style="italic"
        fill="#1a0e07" text-anchor="middle" opacity="0.38">Where cognitive exploration, research, and human understanding converge.</text>

  <!-- Bottom border accent -->
  <rect x="0" y="620" width="1200" height="10" fill="#8b2020" opacity="0.25" rx="0"/>
</svg>
